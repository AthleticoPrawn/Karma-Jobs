<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Karma Dog Walks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-wrap narrow">
    <header class="site-header">
      <a href="/" class="logo">🐾 Karma Dog Walks</a>
    </header>

    <main>
      <h1>Log in</h1>

      <form id="login-form" class="card" novalidate>
        <div id="form-error" class="alert alert-error hidden"></div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" required
                 placeholder="e.g. 07700 900123">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
          Log in
        </button>

        <p class="form-footer">Don't have an account? <a href="/register">Create one</a></p>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    // Read ?next= param for post-login redirect
    const next = new URLSearchParams(window.location.search).get('next') || '/slots';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: document.getElementById('phone').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || 'Something went wrong');
        } else {
          window.location.href = next;
        }
      } catch {
        showError('Network error — please try again');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
