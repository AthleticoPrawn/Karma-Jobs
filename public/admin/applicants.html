<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicants — Karma Dog Walks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-wrap">
    <header class="site-header">
      <a href="/admin/" class="logo">🐾 Karma Dog Walks</a>
      <nav class="nav">
        <a href="/admin/" class="btn btn-ghost btn-sm">← All slots</a>
        <span class="nav-label">Walker admin</span>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
      </nav>
    </header>

    <main>
      <div id="slot-detail" class="card slot-detail-header">

      <div id="applicants-container">
        <p class="loading-text">Loading applicants…</p>
      </div>

  </div>

  <script src="/js/admin-applicants.js"></script>
