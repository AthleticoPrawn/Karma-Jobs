<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walker Login — Karma Dog Walks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-wrap narrow">
    <header class="site-header">
      <a href="/" class="logo">🐾 Karma Dog Walks</a>
    </header>

    <main>
      <h1>Walker login</h1>
      <p class="subtitle">Admin access for walk organisers.</p>

      <form id="admin-login-form" class="card" novalidate>
        <div id="form-error" class="alert alert-error hidden"></div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password"
                 required autofocus>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
          Log in
        </button>
      </form>

      <p class="form-footer"><a href="/">← Back to public site</a></p>
    </main>
  </div>

  <script>
    const form = document.getElementById('admin-login-form');
    const errorBox = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || 'Incorrect password');
        } else {
          window.location.href = '/admin/';
        }
      } catch {
        showError('Network error — please try again');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
