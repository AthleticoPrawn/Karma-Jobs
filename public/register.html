<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Karma Dog Walks</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-wrap narrow">
    <header class="site-header">
      <a href="/" class="logo">🐾 Karma Dog Walks</a>
    </header>

    <main>
      <h1>Create your account</h1>
      <p class="subtitle">Register to browse and apply for available walks.</p>

      <form id="register-form" class="card" novalidate>
        <div id="form-error" class="alert alert-error hidden"></div>

        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" required
                 placeholder="e.g. 07700 900123">
          <small>This is your login username</small>
        </div>

        <div class="field">
          <label for="dog_name">Dog's name</label>
          <input type="text" id="dog_name" name="dog_name" required>
        </div>

        <div class="field">
          <label for="address">Rough address / area</label>
          <input type="text" id="address" name="address" required
                 placeholder="e.g. Chorlton, M21">
          <small>Just your neighbourhood — we use this to plan routes</small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
                 required minlength="6">
          <small>At least 6 characters</small>
        </div>

        <div class="field">
          <label for="password2">Confirm password</label>
          <input type="password" id="password2" name="password2" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
          Create account
        </button>

        <p class="form-footer">Already have an account? <a href="/login">Log in</a></p>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const errorBox = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');

      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password !== password2) {
        showError('Passwords do not match');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            dog_name: document.getElementById('dog_name').value.trim(),
            address: document.getElementById('address').value.trim(),
            password
          })
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || 'Something went wrong');
        } else {
          window.location.href = '/slots';
        }
      } catch {
        showError('Network error — please try again');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
